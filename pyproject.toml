[project]
name = "gamebot"
version = "0.1.0"
description = "A game engine for chatbot games"
authors = [
    { name = "luanarium", email = "luanarium@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.5.0",
    "lark>=1.3.1",
    "pluggy>=1.6.0",
]

[project.scripts]
gamebot = "gamebot.cli:main"

[project.optional-dependencies]
discord = [
    "discord-py>=2.7",
]

# Bot adapters are pluggy plugins under the "gamebot" entry-point group.
[project.entry-points.gamebot]
discord = "gamebot.adapters.discord"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
